<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80f0ff"/>
      <stop offset="100%" stop-color="#00e0ff"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#020510"/>
  <!-- centered pulse line -->
  <path d="M40 256 L160 256 L200 180 L240 332 L280 200 L320 256 L472 256"
    fill="none" stroke="url(#g)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- small dot accent -->
  <circle cx="256" cy="256" r="14" fill="#80f0ff" opacity="0.9" filter="url(#glow)"/>
</svg>
